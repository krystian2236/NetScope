name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Repository integrity
        run: |
          git diff --check
          test -f AGENTS.md
          test -f SPEC.md
          test -f ROADMAP.md
          test -f TASKS.md
          test -x scripts/pre-push-check.sh
          test -x scripts/test-project-integrity.sh

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -project NetScope.xcodeproj -list

      - name: Build NetScope
        run: |
          set -o pipefail
          xcodebuild             -project NetScope.xcodeproj             -scheme NetScope             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
