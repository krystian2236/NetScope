name: AI quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow artifacts
        run: ./scripts/validate-ai-workflow.sh
      - name: Project integrity
        run: ./scripts/test-project-integrity.sh
  codeql:
    name: CodeQL
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
